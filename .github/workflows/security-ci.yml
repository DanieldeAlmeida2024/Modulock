name: Modulock - verificações de firmware e segurança

on:
  pull_request:
    branches: [main, fix/p0-uid-exposure-and-registration-20261111]
  push:
    branches: [main, fix/timing-rollover-and-serial-privacy-20261111]

permissions:
  contents: read

jobs:
  policy-host:
    name: Guardas UID - C++ host
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Testar política de UID e overflow millis
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -Iinclude test/security_policy_test.cpp -o /tmp/modulock_security_test
          /tmp/modulock_security_test
      - name: Verificar ligação das rotas autenticadas
        run: |
          python3 test/test_security_wiring.py
          python3 test/test_timing_privacy_wiring.py

  firmware:
    name: Compilar firmware ESP32
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar PlatformIO
        run: python -m pip install "platformio==6.1.18"
      - name: Compilar sem flash e sem hardware
        run: pio run -e esp32dev
